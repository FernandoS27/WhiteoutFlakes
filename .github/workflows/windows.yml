name: Windows Build

# Runnable manually (Actions tab → "Run workflow" / `gh workflow run windows.yml`)
# and callable by release.yml as a reusable workflow so the release run gets the
# .zip artifact.
on:
  workflow_dispatch:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build .exe (Windows x64, MSVC)
    runs-on: windows-latest

    env:
      BUILD_TYPE: Release
      # The LunarG Vulkan SDK is a BUILD dependency: it provides slangc (which
      # compiles the viewer's engine shaders to DXBC + SPIR-V) plus the Vulkan
      # headers, loader import lib, and VMA (vk_mem_alloc.h) needed by the Vulkan
      # gfx backend — which IS compiled on Windows (the viewer offers a Vulkan
      # backend alongside D3D12/D3D11). vulkan-1.dll itself ships with the user's
      # GPU driver at run time, so nothing Vulkan is bundled. Pin the same SDK
      # version as the Linux/macOS jobs so slangc emits identical shader bytes.
      VULKAN_SDK_VERSION: 1.4.341.0

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # The installer download + silent install is the slowest part of this job,
      # so cache the SDK tree and skip the installer on a hit. The `-vma` key
      # suffix distinguishes this VMA-inclusive install from an earlier cache
      # that lacked it (the default install omits the VMA component).
      - name: Cache Vulkan SDK
        id: cache-vulkan
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-windows-${{ env.VULKAN_SDK_VERSION }}-vma

      # The default silent install pulls only the core (headers, loader, tools
      # incl. slangc). VMA (vk_mem_alloc.h) is a separate optional component the
      # Vulkan gfx backend needs, so request it explicitly — mirrors the macOS
      # job's `com.lunarg.vulkan.vma`. Core is force-installed alongside it.
      - name: Install Vulkan SDK
        if: steps.cache-vulkan.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = $env:VULKAN_SDK_VERSION
          $url = "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe"
          $exe = Join-Path $env:RUNNER_TEMP 'VulkanSDK-Installer.exe'
          Write-Host "Downloading Vulkan SDK $ver"
          curl.exe -L --fail -o $exe $url
          $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList `
            '--accept-licenses','--default-answer','--confirm-command', `
            'install','com.lunarg.vulkan.vma'
          if ($p.ExitCode -ne 0) { throw "Vulkan SDK installer exited $($p.ExitCode)" }

      # Runs on both cache hit and miss. Sets VULKAN_SDK so find_package(Vulkan)
      # resolves to this install, puts slangc on PATH for find_program(SLANGC),
      # and asserts VMA is present (a missing vk_mem_alloc.h here fails loudly
      # rather than deep in the WhiteoutFlakesGfx compile).
      - name: Export Vulkan SDK environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          if (-not (Test-Path "$sdk\Bin\slangc.exe")) {
              throw "slangc.exe not found under $sdk\Bin (cache may be corrupt)"
          }
          if (-not (Test-Path "$sdk\Include\vma\vk_mem_alloc.h")) {
              throw "vk_mem_alloc.h not found under $sdk\Include\vma (VMA component missing)"
          }
          "VULKAN_SDK=$sdk" | Out-File $env:GITHUB_ENV  -Append -Encoding utf8
          "$sdk\Bin"        | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          & "$sdk\Bin\slangc.exe" -v 2>&1 | Select-Object -First 1

      # WC3 model shaders ship prebuilt under prebuilt/shaders
      # (WDX_USE_PREBUILT_SHADERS), so no BLS/Slang model-shader build runs.
      #
      # WebGPU/Dawn is intentionally OFF: D3D12 is the native, primary backend on
      # Windows (D3D11 and Vulkan also available), so the shipped viewer needs no
      # external runtime. Skipping the Dawn FetchContent keeps CI lean. The
      # Package step still bundles webgpu_dawn.dll if a future build produces it.
      - name: Configure
        run: >
          cmake -S . -B build -A x64
          -DWDX_BUILD_WC3_SHADERS=OFF
          -DWDX_USE_PREBUILT_SHADERS=ON
          -DWDX_BUILD_WC3_DEBUG_SHADERS=OFF
          -DWDX_ENABLE_TRACY=OFF
          -DWDX_BUILD_MAX_PLUGIN=OFF
          -DWDX_ENABLE_WEBGPU=OFF

      - name: Build viewer
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --target WhiteoutFlakesStandalone --parallel

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'WhiteoutFlakes-windows-x64'
          New-Item -ItemType Directory -Force $stage | Out-Null

          # RUNTIME_OUTPUT_DIRECTORY_RELEASE pins the exe (and its POST_BUILD
          # asset copies) to build/standalone, with no per-config subdir.
          $rt = 'build/standalone'
          Copy-Item "$rt/WhiteoutFlakes.exe" $stage/

          # Prebuilt .bls shader bundles (d3d12/ps/vs used by the D3D backends),
          # staged into standalone/shaders by WDX_USE_PREBUILT_SHADERS. The exe
          # resolves ./shaders next to itself at runtime.
          Copy-Item "$rt/shaders" "$stage/shaders" -Recurse

          # Localization catalogs (lang/*.ini) + bundled Noto CJK fonts
          # (fonts/*.ttf), copied next to the exe by the CMake POST_BUILD rule;
          # the viewer resolves them from the exe dir.
          Copy-Item "$rt/lang"  "$stage/lang"  -Recurse
          Copy-Item "$rt/fonts" "$stage/fonts" -Recurse

          # PSO-trace seed (committed): the viewer copies pso_trace.bin from the
          # exe dir on first run to pre-warm the pipeline cache. Optional — the
          # app rebuilds PSOs if it's absent.
          if (Test-Path 'prebuilt/pso_trace.bin') { Copy-Item 'prebuilt/pso_trace.bin' $stage/ }

          # WebGPU/Dawn runtime, if a build produced it (WDX_ENABLE_WEBGPU).
          if (Test-Path "$rt/webgpu_dawn.dll") { Copy-Item "$rt/webgpu_dawn.dll" $stage/ }

          # Bundled docs.
          Copy-Item LICENSE,LICENSE-AI.md,README.md $stage/

          $sha = $env:GITHUB_SHA.Substring(0, 8)
          $zip = "WhiteoutFlakes-$sha-windows-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          "ARTIFACT=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: WhiteoutFlakes-windows-x64
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error
          retention-days: 14
