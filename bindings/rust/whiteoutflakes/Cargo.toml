# SPDX-License-Identifier: BSD-3-Clause
[package]
name        = "whiteoutflakes"
description = "Rust bindings for the WhiteoutFlakes renderer service library."
keywords    = ["warcraft", "renderer", "mdx", "graphics"]
categories  = ["game-development", "rendering"]
readme      = "README.md"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

include = [
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
    "README.md",
]

[features]
# Passed straight through to the sys crate, which is where they decide
# which gfx backends compile and which shader packs get staged.
default = ["d3d11", "casc", "bundled-whiteoutlib"]
d3d11  = ["whiteoutflakes-sys/d3d11"]
d3d12  = ["whiteoutflakes-sys/d3d12"]
vulkan = ["whiteoutflakes-sys/vulkan"]
metal  = ["whiteoutflakes-sys/metal"]
webgpu = ["whiteoutflakes-sys/webgpu"]
casc   = ["whiteoutflakes-sys/casc"]
mpq    = ["whiteoutflakes-sys/mpq"]

# Where WhiteoutLib's C++ comes from — see the sys crate. Switch to
# `system-whiteoutlib` when the same binary also depends on the
# `whiteoutlib` crate, so it is compiled once rather than twice.
bundled-whiteoutlib = ["whiteoutflakes-sys/bundled-whiteoutlib"]
system-whiteoutlib  = ["whiteoutflakes-sys/system-whiteoutlib"]

[dependencies]
whiteoutflakes-sys = { version = "0.3.1", path = "../whiteoutflakes-sys", default-features = false }

[dev-dependencies]
raw-window-handle = "0.6"
winit = "0.30"
# examples/playback_gui only. A dev-dependency, so it never reaches anyone
# who depends on this crate — the renderer brings no GUI toolkit and has no
# opinion about which one a host uses.
#
# Raw Win32 rather than a toolkit because the point of that example is that
# each panel is a real child window with its own swap chain, rendered
# directly. A toolkit that owns the GPU (egui/wgpu and friends) would force
# the scene through a readback instead, which is both slower and, outside
# WebGPU, not implemented.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[package.metadata.docs.rs]
# docs.rs has no C++ toolchain and no patience for one; build.rs skips the
# native build when DOCS_RS is set, so the crate still documents.
all-features = false
