# SPDX-License-Identifier: BSD-3-Clause
[package]
name        = "whiteoutflakes-sys"
description = "Native library and raw FFI declarations for the WhiteoutFlakes renderer."
keywords    = ["warcraft", "renderer", "ffi", "sys"]
categories  = ["external-ffi-bindings", "game-development"]
readme      = "README.md"
build       = "build.rs"
# Declared so cargo rejects two crates linking the same native library, and
# so `whiteoutflakes` can read this build script's DEP_WHITEOUTFLAKES_*
# metadata (that mechanism only works through a `links` crate).
links       = "whiteoutflakes"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

# `vendor/` is staged by scripts/vendor-rust.ps1 and is gitignored — the
# C++ sources live at the repo root, and cargo cannot package files from
# outside the crate directory. Publishing without staging first yields a
# crate that cannot build; `cargo package` catches that because the
# verification build runs.
include = [
    "src/**/*.rs",
    "build.rs",
    "vendor-cmake/**",
    "vendor/**",
    "README.md",
]

[features]
# Which shader packs get staged, and which gfx backends get compiled.
# d3d11 is the default because its pack is the small one (~1 MB vs ~9 MB)
# and it needs no SDK.
default = ["d3d11", "casc", "bundled-whiteoutlib"]
d3d11  = ["dep:whiteoutflakes-shaders-d3d11"]
d3d12  = ["dep:whiteoutflakes-shaders-d3d12"]
vulkan = ["dep:whiteoutflakes-shaders-vulkan"]
metal  = ["dep:whiteoutflakes-shaders-metal"]
# WebGPU additionally needs a Dawn distribution at build time; point
# WHITEOUTFLAKES_DAWN_DIR at one. Nothing is downloaded.
webgpu = ["dep:whiteoutflakes-shaders-webgpu"]
# CASC lets the renderer resolve assets out of an installed Warcraft III.
# WhiteoutLib implements it directly — no external library — so this only
# costs compile time. Default ON: without it a Reforged model whose
# textures live in game storage renders as untextured placeholder pink.
#
# In `system-whiteoutlib` mode the storage code lives in the other crate's
# archive, so the feature has to reach it too — otherwise this crate would
# compile against `WHITEOUT_HAS_CASC=1` headers and link against a library
# built without them.
casc = ["whiteoutlib?/casc"]

# Where WhiteoutLib comes from.
#
# `bundled-whiteoutlib` (default) compiles the vendored copy into this
# crate's archive: one dependency, self-contained, and correct for anyone
# using the renderer alone.
#
# `system-whiteoutlib` instead depends on the `whiteoutlib` crate, which
# declares `links = "whiteout_native"` and publishes where it built the
# library. Use it when the same binary also uses `whiteoutlib` directly:
# otherwise WhiteoutLib is compiled twice and ~1,551 identically-mangled
# C++ symbols end up defined in both archives, with the linker silently
# picking one. See BINDINGS.md §17.
#
# Features are additive, so enabling both is legal; `system-whiteoutlib`
# wins, since the whole point is that the vendored copy stops being built.
bundled-whiteoutlib = []
system-whiteoutlib  = ["dep:whiteoutlib"]

[dependencies]
# A regular dependency, not a build-dependency: `DEP_WHITEOUT_NATIVE_*`
# reaches the build script either way, but this also puts the crate's own
# Rust API in the dependency graph, which is the situation this mode is
# for. `version` is what a published build resolves; `path` is what a
# checkout uses.
whiteoutlib = { version = "0.1.0", optional = true }

[build-dependencies]
cmake = "0.1"
# Build-dependencies rather than regular ones: these crates exist to hand
# the build script a directory of files to copy, and nothing links them.
whiteoutflakes-shaders-d3d11  = { version = "0.1.0", path = "../whiteoutflakes-shaders-d3d11",  optional = true }
whiteoutflakes-shaders-d3d12  = { version = "0.1.0", path = "../whiteoutflakes-shaders-d3d12",  optional = true }
whiteoutflakes-shaders-vulkan = { version = "0.1.0", path = "../whiteoutflakes-shaders-vulkan", optional = true }
whiteoutflakes-shaders-metal  = { version = "0.1.0", path = "../whiteoutflakes-shaders-metal",  optional = true }
whiteoutflakes-shaders-webgpu = { version = "0.1.0", path = "../whiteoutflakes-shaders-webgpu", optional = true }
