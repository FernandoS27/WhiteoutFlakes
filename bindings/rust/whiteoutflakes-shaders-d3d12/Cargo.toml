# SPDX-License-Identifier: BSD-3-Clause
[package]
name        = "whiteoutflakes-shaders-d3d12"
description = "Prebuilt WhiteoutFlakes BLS shader pack — Direct3D 12 (DXIL)."
keywords    = ["warcraft", "shaders", "graphics"]
categories  = ["game-development", "rendering"]
include     = ["src/**/*.rs", "pack/**", "README.md"]
# Pinned, not inherited: the packs are prebuilt shader blobs that only
# change when the shaders do, so they stay put while the crates around
# them move.
version                = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[dependencies]
