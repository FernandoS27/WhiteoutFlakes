settings.general.m2_lazy_anim.tip=Carrega um modelo do WoW sem os arquivos .anim vizinhos e lê um deles na primeira vez que sua sequência é reproduzida, como o jogo faz. Vale para o próximo modelo carregado.
settings.general.d3_lazy_anim=Transmitir clipes .ani (D3)
settings.general.d3_lazy_anim.tip=Lê um clipe do Diablo III na primeira vez que sua sequência é reproduzida em vez de carregar o AnimSet inteiro. Um AnimSet de personagem nomeia 259 clipes e 5,8 MB de chaves. Ligado por padrão; vale para o próximo modelo carregado.
settings.general.m2_dist_sort=Ordenar por profundidade a geometria M2 transparente
settings.general.m2_dist_sort.tip=Ordena a geometria transparente do WoW de trás para frente pela distância da câmera. O jogo não faz isso: ele ordena por plano de prioridade, depois camada de material, depois modo de mesclagem, e deixa sem ordenar a geometria de modelos diferentes. Desligado corresponde ao jogo; ligado fica melhor com vários modelos transparentes na tela.
settings.general.m2_model_lights=Luzes do modelo (M2)
settings.general.m2_model_lights.tip=Deixa os blocos de luz do próprio modelo do WoW iluminá-lo: tochas, braseiros e criaturas brilhantes. O jogo mantém as três mais próximas do centro do modelo e as atenua por 1/(0,7d + 0,03d^2). Desligado deixa apenas a luz principal.
settings.general.physics_substep=Subpassos de física
settings.general.physics_substep.tip=Divide cada quadro em vários passos de física menores. O StarCraft II dá exatamente um passo por quadro renderizado, o que permite que um colisor rápido atravesse o tecido: a 60 fps, metade dos quadros da caminhada de Jaina termina com a capa dela dentro de uma perna. O jogo disfarça isso reajustando os números no editor de dados, o que não é uma alavanca de quem visualiza modelos já publicados. Desligado reproduz a cadência publicada.
