settings.general.m2_lazy_anim.tip=Carica un modello WoW senza i file .anim affiancati e ne legge uno la prima volta che la sua sequenza viene riprodotta, come fa il gioco. Vale per il prossimo modello caricato.
settings.general.d3_lazy_anim=Trasmetti le clip .ani (D3)
settings.general.d3_lazy_anim.tip=Legge una clip di Diablo III alla prima riproduzione della sua sequenza invece di caricare l'intero AnimSet. Un AnimSet di personaggio nomina 259 clip e 5,8 MB di chiavi. Attivo di default; vale per il prossimo modello caricato.
settings.general.m2_dist_sort=Ordina in profondità la geometria M2 trasparente
settings.general.m2_dist_sort.tip=Ordina la geometria trasparente di WoW dal fondo verso il davanti in base alla distanza dalla camera. Il gioco non lo fa: ordina per piano di priorità, poi livello di materiale, poi modalità di fusione, e lascia non ordinata la geometria di modelli diversi. Disattivo corrisponde al gioco; attivo rende meglio con più modelli trasparenti a schermo.
settings.general.m2_model_lights=Luci del modello (M2)
settings.general.m2_model_lights.tip=Lascia che i blocchi luce propri di un modello WoW lo illuminino: torce, bracieri e creature luminose. Il gioco tiene le tre più vicine al centro del modello e le attenua con 1/(0,7d + 0,03d^2). Disattivo lascia solo la luce principale.
settings.general.physics_substep=Sottopassi di fisica
settings.general.physics_substep.tip=Divide ogni frame in più passi di fisica più piccoli. StarCraft II compie esattamente un passo per frame renderizzato, il che permette a un collisore veloce di attraversare il tessuto: a 60 fps metà dei frame della camminata di Jaina finisce con il mantello dentro una gamba. Il gioco lo nasconde ritarando i numeri nell'editor dei dati, che non è una leva a disposizione di chi visualizza modelli già pubblicati. Disattivo riproduce la cadenza pubblicata.
