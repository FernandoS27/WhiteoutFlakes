# WhiteoutFlakes UI translation catalog - English (authoritative source)
#
# Format: key=value, UTF-8, no BOM. One string per line.
# Translation rules for the other language files:
#   * Translate ONLY the value (right of '='); keep the key (left of '=') verbatim.
#   * Preserve every printf specifier exactly: %s %d %u %zu %llu %.0f %.2f %% etc.
#   * Preserve any "##id" suffix in a value verbatim (it is an ImGui widget id).
#   * "\n" in a value becomes a line break; keep them where present.
#   * Technical tokens stay in English (format codes like BC1, MDX, product names).

