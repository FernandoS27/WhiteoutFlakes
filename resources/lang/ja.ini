settings.general.m2_lazy_anim=.anim ファイルをストリーミング (M2)
settings.general.m2_lazy_anim.tip=WoW モデルを隣の .anim ファイルなしで読み込み、そのシーケンスが最初に再生されたときにゲームと同じように読み取ります。次に読み込むモデルから有効です。
settings.general.d3_lazy_anim=.ani クリップをストリーミング (D3)
settings.general.d3_lazy_anim.tip=AnimSet 全体を読み込む代わりに、Diablo III のクリップをそのシーケンスが最初に再生されたときに読み取ります。キャラクターの AnimSet 1 つで 259 クリップ、キーは 5.8 MB になります。既定でオン。次に読み込むモデルから有効です。
settings.general.m2_dist_sort=半透明の M2 ジオメトリを深度ソート
settings.general.m2_dist_sort.tip=WoW の半透明ジオメトリをカメラ距離で奥から手前へ並べ替えます。ゲームはそうしません。優先プレーン、マテリアルレイヤー、ブレンドモードの順に並べ、別々のモデル同士は並べ替えません。オフはゲームと一致し、オンは半透明モデルが複数ある画面できれいに見えます。
settings.general.m2_model_lights=モデルライト (M2)
settings.general.m2_model_lights.tip=WoW モデル自身のライトブロックでモデルを照らします。たいまつ、火鉢、発光するクリーチャーなど。ゲームはモデル中心に最も近い 3 つを残し、1/(0.7d + 0.03d^2) で減衰させます。オフではキーライトだけが残ります。
settings.general.physics_substep=物理のサブステップ
settings.general.physics_substep.tip=各フレームを複数の小さな物理ステップに分割します。StarCraft II は描画フレームごとにちょうど 1 ステップしか進めないため、速いコライダーがクロスをすり抜けます。60 fps ではジェイナの歩行の半分のフレームでマントが脚の中に入ってしまいます。ゲームはデータエディタで数値を調整して隠していますが、出荷済みモデルを見る側にそのレバーはありません。オフは出荷時のままの刻みを再現します。
