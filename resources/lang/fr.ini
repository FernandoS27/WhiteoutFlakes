settings.general.m2_lazy_anim=Diffuser les fichiers .anim (M2)
settings.general.m2_lazy_anim.tip=Charge un modèle WoW sans ses fichiers .anim voisins et en lit un la première fois que sa séquence est jouée, comme le fait le jeu. S'applique au prochain modèle chargé.
settings.general.d3_lazy_anim=Diffuser les clips .ani (D3)
settings.general.d3_lazy_anim.tip=Lit un clip Diablo III la première fois que sa séquence est jouée au lieu de charger l'AnimSet entier. Un AnimSet de personnage nomme 259 clips et 5,8 Mo de clés. Activé par défaut ; s'applique au prochain modèle chargé.
settings.general.m2_dist_sort=Trier en profondeur la géométrie M2 transparente
settings.general.m2_dist_sort.tip=Trie la géométrie transparente de WoW d'arrière en avant selon la distance à la caméra. Le jeu ne le fait pas : il ordonne par plan de priorité, puis couche de matériau, puis mode de fusion, et laisse non triée la géométrie de modèles différents. Désactivé correspond au jeu ; activé rend mieux avec plusieurs modèles transparents à l'écran.
settings.general.m2_model_lights=Lumières du modèle (M2)
settings.general.m2_model_lights.tip=Laisse les blocs de lumière propres à un modèle WoW l'éclairer : torches, braseros et créatures luminescentes. Le jeu conserve les trois plus proches du centre du modèle et les atténue par 1/(0,7d + 0,03d^2). Désactivé ne laisse que la lumière principale.
settings.general.physics_substep=Sous-pas de physique
settings.general.physics_substep.tip=Découpe chaque image en plusieurs pas de physique plus petits. StarCraft II effectue exactement un pas par image rendue, ce qui laisse un collisionneur rapide traverser le tissu : à 60 ips, la moitié des images de la marche de Jaina se terminent avec sa cape dans une jambe. Le jeu masque cela en réajustant les valeurs dans l'éditeur de données, ce qui n'est pas un levier dont dispose celui qui visualise des modèles publiés. Désactivé reproduit la cadence publiée.
