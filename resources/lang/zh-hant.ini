# Settings > General
settings.general.background=背景
settings.general.exposure=曝光
settings.general.snd_volume=音量
settings.general.loop_nonlooping=循環播放非循環動畫
settings.general.m2_lazy_anim=串流讀取 .anim 檔案 (M2)
settings.general.m2_lazy_anim.tip=載入 WoW 模型時不帶同目錄的 .anim 檔案，等到某段序列第一次播放時才讀取它，和遊戲的做法一致。對下一個載入的模型生效。
settings.general.d3_lazy_anim=串流讀取 .ani 片段 (D3)
settings.general.d3_lazy_anim.tip=在某段序列第一次播放時才讀取對應的 Diablo III 片段，而不是載入整個 AnimSet。一個角色 AnimSet 會引用 259 個片段、5.8 MB 的關鍵影格。預設開啟；對下一個載入的模型生效。
settings.general.m2_dist_sort=依深度排序半透明 M2 幾何
settings.general.m2_dist_sort.tip=依到攝影機的距離把 WoW 的半透明幾何由後往前排序。遊戲並不這麼做：它先依優先權平面，再依材質層，再依混合模式排序，且不同模型之間的幾何完全不排序。關閉時與遊戲一致；開啟時畫面上有多個半透明模型會比較好看。
settings.general.m2_model_lights=模型自帶光源 (M2)
settings.general.m2_model_lights.tip=讓 WoW 模型自帶的光源區塊照亮它自己：火把、火盆和發光生物。遊戲只保留離模型中心最近的三個，並依 1/(0.7d + 0.03d^2) 衰減。關閉後只剩主光。
settings.general.physics_substep=物理子步進
settings.general.physics_substep.tip=把每一影格拆成數個更小的物理步。StarCraft II 每算繪一影格只走一步，這會讓快速移動的碰撞體直接穿過布料——在 60 fps 下，吉安娜行走動畫有一半的影格結束時斗篷是插在腿裡的。遊戲靠在資料編輯器裡重新調參來掩蓋這一點，而檢視成品模型的人並沒有這根槓桿。關閉時重現遊戲出廠的節奏。
