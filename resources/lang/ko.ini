settings.general.m2_lazy_anim.tip=WoW 모델을 옆의 .anim 파일 없이 불러오고, 해당 시퀀스가 처음 재생될 때 게임과 같은 방식으로 읽습니다. 다음에 불러오는 모델부터 적용됩니다.
settings.general.d3_lazy_anim=.ani 클립 스트리밍 (D3)
settings.general.d3_lazy_anim.tip=AnimSet 전체를 불러오는 대신 Diablo III 클립을 해당 시퀀스가 처음 재생될 때 읽습니다. 캐릭터 AnimSet 하나가 클립 259개와 키 5.8 MB를 참조합니다. 기본값은 켜짐이며, 다음에 불러오는 모델부터 적용됩니다.
settings.general.m2_dist_sort=반투명 M2 지오메트리 깊이 정렬
settings.general.m2_dist_sort.tip=WoW의 반투명 지오메트리를 카메라 거리 기준으로 뒤에서 앞으로 정렬합니다. 게임은 그렇게 하지 않습니다. 우선순위 평면, 머티리얼 레이어, 블렌드 모드 순으로 정렬하고 서로 다른 모델의 지오메트리는 정렬하지 않습니다. 끄면 게임과 같고, 켜면 반투명 모델이 여러 개 있을 때 더 보기 좋습니다.
settings.general.m2_model_lights=모델 광원 (M2)
settings.general.m2_model_lights.tip=WoW 모델 자체의 광원 블록이 모델을 비추게 합니다. 횃불, 화로, 빛나는 크리처 등입니다. 게임은 모델 중심에 가장 가까운 세 개만 남기고 1/(0.7d + 0.03d^2)로 감쇠시킵니다. 끄면 주광만 남습니다.
settings.general.physics_substep=물리 서브스테핑
settings.general.physics_substep.tip=각 프레임을 여러 개의 더 작은 물리 스텝으로 나눕니다. StarCraft II는 렌더링된 프레임당 정확히 한 스텝만 진행하므로 빠른 콜라이더가 천을 그대로 통과합니다. 60 fps에서는 제이나 걷기 프레임의 절반이 망토가 다리 안에 들어간 채로 끝납니다. 게임은 데이터 편집기에서 수치를 다시 맞춰 이를 가리지만, 출시된 모델을 보는 쪽에는 그런 수단이 없습니다. 끄면 출시된 그대로의 진행 방식을 재현합니다.
