settings.general.m2_lazy_anim=Потоково читать файлы .anim (M2)
settings.general.m2_lazy_anim.tip=Загружает модель WoW без соседних файлов .anim и читает нужный при первом проигрывании его последовательности - так же, как это делает игра. Действует для следующей загруженной модели.
settings.general.d3_lazy_anim=Потоково читать клипы .ani (D3)
settings.general.d3_lazy_anim.tip=Читает клип Diablo III при первом проигрывании его последовательности вместо загрузки всего AnimSet. Один AnimSet персонажа перечисляет 259 клипов и 5,8 МБ ключей. Включено по умолчанию; действует для следующей загруженной модели.
settings.general.m2_dist_sort=Сортировать прозрачную геометрию M2 по глубине
settings.general.m2_dist_sort.tip=Сортирует прозрачную геометрию WoW от дальней к ближней по расстоянию до камеры. Игра так не делает: она упорядочивает по плоскости приоритета, затем по слою материала, затем по режиму смешивания, а геометрию разных моделей не сортирует вовсе. Выключено соответствует игре; включено выглядит лучше, когда на экране несколько прозрачных моделей.
settings.general.m2_model_lights=Источники света модели (M2)
settings.general.m2_model_lights.tip=Позволяет собственным блокам света модели WoW освещать её: факелы, жаровни и светящиеся существа. Игра оставляет три ближайших к центру модели и затухает их по 1/(0,7d + 0,03d^2). Выключено оставляет только основной свет.
settings.general.physics_substep=Подшаги физики
settings.general.physics_substep.tip=Разбивает каждый кадр на несколько меньших шагов физики. StarCraft II делает ровно один шаг на отрисованный кадр, из-за чего быстрый коллайдер пролетает сквозь ткань: при 60 кадр/с половина кадров ходьбы Джайны заканчивается с плащом внутри ноги. Игра скрывает это, подстраивая числа в редакторе данных, а это не тот рычаг, который есть у зрителя готовых моделей. Выключено воспроизводит исходный ритм.
