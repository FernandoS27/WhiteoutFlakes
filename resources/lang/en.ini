settings.general.loop_nonlooping=Loop NonLooping animations
settings.general.m2_lazy_anim=Stream .anim files (M2)
settings.general.m2_lazy_anim.tip=Load a WoW model without its .anim siblings and read one the first time its sequence plays, the way the game does. Applies to the next model loaded.
settings.general.d3_lazy_anim=Stream .ani clips (D3)
settings.general.d3_lazy_anim.tip=Read a Diablo III clip the first time its sequence plays instead of loading the whole AnimSet. One character AnimSet names 259 clips and 5.8 MB of keys. On by default; applies to the next model loaded.
settings.general.m2_dist_sort=Depth-sort transparent M2 geometry
settings.general.m2_dist_sort.tip=Sort transparent WoW geometry back to front by camera distance. The game does not: it orders by priority plane, then material layer, then blend mode, and leaves geometry from different models unsorted. Off matches the game; on looks better with several transparent models on screen.
settings.general.m2_model_lights=Model lights (M2)
settings.general.m2_model_lights.tip=Let a WoW model's own light blocks light it - torches, braziers and glowing creatures. The game keeps the three nearest to the model centre and attenuates them by 1/(0.7d + 0.03d^2). Off leaves only the key light.
settings.general.m3_pose_solvers=Pose solvers (SC2)
settings.general.m3_pose_solvers.tip=Run StarCraft II's post-skeleton solvers: terrain foot IK (IKJT) and turret aiming (PATU). Feet plant on the grid, the same ground plane the physics stages collide with, rather than on terrain. Off leaves the pose exactly as the animation sampled it.
settings.general.physics_substep=Physics substepping
settings.general.physics_substep.tip=Split each frame into several smaller physics steps. StarCraft II takes exactly one step per rendered frame, which lets a fast collider pass straight through cloth - at 60 fps half the frames of Jaina's walk end with her cape inside a leg. The game hides that by retuning the numbers in the data editor, which is not a lever a viewer of shipped models has. Off reproduces the shipped cadence.
