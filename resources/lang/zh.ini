settings.general.loop_nonlooping=循环播放非循环动画
settings.general.m2_lazy_anim=流式读取 .anim 文件 (M2)
settings.general.m2_lazy_anim.tip=载入 WoW 模型时不带同目录的 .anim 文件，等到某段序列第一次播放时才读取它，和游戏的做法一致。对下一个载入的模型生效。
settings.general.d3_lazy_anim=流式读取 .ani 片段 (D3)
settings.general.d3_lazy_anim.tip=在某段序列第一次播放时才读取对应的 Diablo III 片段，而不是载入整个 AnimSet。一个角色 AnimSet 会引用 259 个片段、5.8 MB 的关键帧。默认开启；对下一个载入的模型生效。
settings.general.m2_dist_sort=按深度排序半透明 M2 几何
settings.general.m2_dist_sort.tip=按到摄像机的距离将 WoW 的半透明几何从后往前排序。游戏并不这样做：它先按优先级平面，再按材质层，再按混合模式排序，且不同模型之间的几何完全不排序。关闭时与游戏一致；开启时在画面上有多个半透明模型时更好看。
settings.general.m2_model_lights=模型自带光源 (M2)
settings.general.m2_model_lights.tip=让 WoW 模型自带的光源块照亮它自己：火把、火盆和发光生物。游戏只保留离模型中心最近的三个，并按 1/(0.7d + 0.03d^2) 衰减。关闭后只剩主光。
settings.general.physics_substep=物理子步进
settings.general.physics_substep.tip=把每一帧拆成若干更小的物理步。StarCraft II 每渲染一帧只走一步，这会让快速移动的碰撞体直接穿过布料——在 60 fps 下，吉安娜行走动画有一半的帧结束时斗篷是插在腿里的。游戏靠在数据编辑器里重新调参来掩盖这一点，而查看成品模型的人并没有这根杠杆。关闭时复现游戏出厂的节奏。
