settings.general.loop_nonlooping=Nicht-schleifende Animationen wiederholen
settings.general.m2_lazy_anim=.anim-Dateien streamen (M2)
settings.general.m2_lazy_anim.tip=Lädt ein WoW-Modell ohne seine .anim-Geschwister und liest eine davon erst, wenn ihre Sequenz zum ersten Mal abgespielt wird - so wie das Spiel es tut. Gilt für das nächste geladene Modell.
settings.general.d3_lazy_anim=.ani-Clips streamen (D3)
settings.general.d3_lazy_anim.tip=Liest einen Diablo III-Clip erst, wenn seine Sequenz zum ersten Mal abgespielt wird, statt das ganze AnimSet zu laden. Ein Charakter-AnimSet nennt 259 Clips und 5,8 MB an Keys. Standardmäßig an; gilt für das nächste geladene Modell.
settings.general.m2_dist_sort=Transparente M2-Geometrie nach Tiefe sortieren
settings.general.m2_dist_sort.tip=Sortiert transparente WoW-Geometrie nach Kameraabstand von hinten nach vorn. Das Spiel tut das nicht: es ordnet nach Prioritätsebene, dann Materialschicht, dann Blend-Modus, und lässt Geometrie aus verschiedenen Modellen unsortiert. Aus entspricht dem Spiel; an sieht mit mehreren transparenten Modellen im Bild besser aus.
settings.general.m2_model_lights=Modelllichter (M2)
settings.general.m2_model_lights.tip=Lässt die eigenen Lichtblöcke eines WoW-Modells es beleuchten - Fackeln, Kohlebecken und leuchtende Kreaturen. Das Spiel behält die drei, die dem Modellmittelpunkt am nächsten sind, und dämpft sie mit 1/(0,7d + 0,03d^2). Aus lässt nur das Hauptlicht übrig.
settings.general.physics_substep=Physik-Substepping
settings.general.physics_substep.tip=Teilt jeden Frame in mehrere kleinere Physikschritte. StarCraft II macht genau einen Schritt pro gerendertem Frame, wodurch ein schneller Collider glatt durch Stoff hindurchfahren kann - bei 60 fps endet die Hälfte der Frames von Jainas Gang mit ihrem Umhang in einem Bein. Das Spiel verdeckt das, indem es die Werte im Dateneditor nachjustiert, und das ist kein Hebel, den ein Betrachter ausgelieferter Modelle hat. Aus reproduziert die ausgelieferte Taktung.
