# Catalogo de traduccion de la interfaz de WhiteoutFlakes - Espanol
#
# Formato: clave=valor, UTF-8, sin BOM. Una cadena por linea.
# Reglas de traduccion para los archivos de otros idiomas:
#   * Traduce SOLO el valor (a la derecha de '='); mantén la clave (izquierda de '=') tal cual.
#   * Conserva cada especificador printf exactamente: %s %d %u %zu %llu %.0f %.2f %% etc.
#   * Conserva cualquier sufijo "##id" en un valor tal cual (es un id de widget de ImGui).
#   * "\n" en un valor se convierte en un salto de linea; consérvalos donde aparezcan.
#   * Los tokens tecnicos permanecen en ingles (codigos de formato como BC1, MDX, nombres de producto).

