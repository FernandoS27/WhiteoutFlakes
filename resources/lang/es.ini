settings.general.m2_dist_sort.tip=Ordena la geometría transparente de WoW de atrás hacia delante por distancia a la cámara. El juego no lo hace: ordena por plano de prioridad, luego capa de material, luego modo de mezcla, y deja sin ordenar la geometría de modelos distintos. Desactivado coincide con el juego; activado se ve mejor con varios modelos transparentes en pantalla.
settings.general.m2_model_lights=Luces del modelo (M2)
settings.general.m2_model_lights.tip=Deja que los bloques de luz propios de un modelo de WoW lo iluminen: antorchas, braseros y criaturas luminosas. El juego conserva las tres más cercanas al centro del modelo y las atenúa con 1/(0,7d + 0,03d^2). Desactivado deja solo la luz principal.
settings.general.physics_substep=Subpasos de física
settings.general.physics_substep.tip=Divide cada fotograma en varios pasos de física más pequeños. StarCraft II da exactamente un paso por fotograma renderizado, lo que permite que un colisionador rápido atraviese la tela: a 60 fps la mitad de los fotogramas del andar de Jaina terminan con su capa dentro de una pierna. El juego lo disimula reajustando los números en el editor de datos, que no es una palanca que tenga quien visualiza modelos ya publicados. Desactivado reproduce la cadencia publicada.
