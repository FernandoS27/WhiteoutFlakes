<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WhiteoutFlakes — Viewer</title>
<!-- Warm the TLS+H2 connection before the first asset fetch. -->
<link rel="preconnect" href="https://www.hiveworkshop.com" crossorigin>
<style>
  /* Mirrors Hive's `ratory_wc3model_preview` shell — XF block stack,
     color-chip swatches, warm-gold palette. */
  :root {
    --bg:               #0a0a0a;
    --bg-canvas:        #000;
    --panel:            #161616;
    --panel-header:     #1c1c1c;
    --divider:          #2a2a2a;
    --header-text:      #dddddd;   /* "Models", "Team colors" — neutral cream */
    --text:             #c9a14a;   /* list item dim gold */
    --text-bright:      #ffce40;   /* hover / selected gold */
    --title-text:       #e8e8e8;   /* "View in 3D" */
    --muted:            #888888;
    --hover-bg:         #1d1d1d;
    --selected-bg:      rgba(255, 206, 64, 0.08);
    --btn-border:       #8a6a20;
    --topbar-border:    #2a2a2a;
    --progress:         #20c000;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 13px/1.4 "Trebuchet MS", "Segoe UI", Tahoma, Arial, sans-serif;
  }
  body {
    display: grid;
    grid-template-rows: auto 1fr;
    /* Not the implicit `auto` column: its minimum is the top bar's
       min-content, which on a phone is wider than the screen — the whole
       page would size to the control strip and the canvas would hang off
       the right edge. */
    grid-template-columns: minmax(0, 1fr);
    height: 100vh; user-select: none;
  }

  /* Top bar — title + inline controls + close. */
  #topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 16px; background: var(--bg);
    border-bottom: 1px solid var(--topbar-border);
    gap: 12px;
    min-width: 0;
  }
  #topbar .title  { font-size: 22px; color: var(--title-text); font-weight: 600; letter-spacing: 0.2px; }
  #topbar .spacer { flex: 1; }
  #topbar .close  { font-size: 22px; line-height: 1; color: var(--muted);
                    cursor: pointer; padding: 0 8px; }
  #topbar .close:hover { color: var(--title-text); }

  /* Compact muted styling for lighting/grid/volume controls. */
  #topbar .ctrl {
    display: flex; align-items: center; gap: 6px;
    color: var(--muted); font-size: 12px;
  }
  #topbar .ctrl label { user-select: none; }
  #topbar select {
    background: #1a1a1a;
    color: var(--text);
    border: 1px solid #3a3a3a;
    padding: 2px 6px;
    font: inherit;
    border-radius: 2px;
    cursor: pointer;
  }
  #topbar select:hover { border-color: #555; color: var(--text-bright); }
  #topbar input[type="checkbox"] {
    accent-color: #20c000;
    cursor: pointer;
  }
  #fps-readout {
    font-variant-numeric: tabular-nums; /* keeps width stable as digits flip */
    color: var(--text);
    min-width: 3ch;
    text-align: right;
  }

  /* Volume slider — restyled native range. */
  #vol-wrap {
    display: flex; align-items: center; gap: 8px;
    color: var(--muted); font-size: 12px;
  }
  #vol-wrap label { user-select: none; }
  #vol-slider, #tod-slider {
    -webkit-appearance: none; appearance: none;
    width: 140px; height: 3px;
    background: #2a2a2a;
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  #tod-slider { width: 110px; }
  #vol-slider::-webkit-slider-thumb, #tod-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 12px; height: 12px; border-radius: 50%;
    background: #c8c8c8;
    border: 1px solid #000;
    cursor: pointer;
  }
  #vol-slider::-moz-range-thumb, #tod-slider::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%;
    background: #c8c8c8;
    border: 1px solid #000;
    cursor: pointer;
  }

  /* `.ratory.model-viewer` root — canvas grows, sidebar fixed-width. */
  .ratory.model-viewer {
    display: grid;
    grid-template-columns: 1fr 260px;
    min-height: 0; min-width: 0;
    position: relative;
  }
  .ratory.model-viewer > canvas {
    background: var(--bg-canvas);
    width: 100%; height: 100%;
    display: block;
    min-width: 0; min-height: 0;
  }
  .ratory.model-viewer .sidebar {
    background: var(--panel);
    overflow-y: auto;
    border-left: 1px solid var(--divider);
    padding: 0 0 14px;
  }

  /* XF-style block stack. */
  .block { margin: 0 0 10px 0; }
  .block:first-child { margin-top: 0; }
  .block-container { background: var(--panel); }
  .block-header {
    padding: 8px 14px;
    font-size: 15px; font-weight: 700;
    color: var(--header-text);
    background: var(--panel-header);
    border-bottom: 1px solid var(--divider);
    letter-spacing: 0.1px;
  }
  .block-body { padding: 6px 12px; }

  /* Models / Animations / Cameras lists — populated as <a> rows. */
  .block-body.models,
  .block-body.animations,
  .block-body.cameras {
    padding: 4px 0;
  }
  .block-body.models > a,
  .block-body.animations > a,
  .block-body.cameras > a {
    display: block;
    padding: 3px 14px;
    cursor: pointer;
    color: var(--text);
    text-decoration: none;
    font-size: 13px;
  }
  .block-body.models > a:hover,
  .block-body.animations > a:hover,
  .block-body.cameras > a:hover {
    color: var(--text-bright);
  }
  .block-body.models > a.active,
  .block-body.animations > a.active,
  .block-body.cameras > a.active {
    background: var(--selected-bg);
    color: var(--text-bright);
    font-weight: 700;
  }
  .block-body > .empty {
    display: block;
    padding: 3px 14px;
    color: var(--muted);
    font-style: italic;
  }

  /* Model-source buttons — single model, local directory, JSON load-table. */
  #open-model, #open-dir, #load-json {
    display: block;
    margin: 6px 12px;
    background: transparent; color: var(--text);
    border: 1px solid var(--btn-border);
    padding: 5px 10px; cursor: pointer; font: inherit;
    width: calc(100% - 24px);
    border-radius: 2px;
  }
  #open-model:hover, #open-dir:hover, #load-json:hover {
    background: var(--hover-bg); color: var(--text-bright);
  }
  #open-model:active, #open-dir:active, #load-json:active {
    background: rgba(255, 206, 64, 0.12);
  }

  /* color-chips — 6×4 team colors, 6+picker for backgrounds. */
  .block-body.color-chips {
    display: grid; gap: 3px;
    padding: 8px 12px;
  }
  .block-body.team-colors      { grid-template-columns: repeat(8, 1fr); }
  .block-body.background-colors{ grid-template-columns: repeat(7, 1fr); }
  .color-chip {
    display: block;
    width: 100%;
    aspect-ratio: 1;
    cursor: pointer;
    border: 1px solid #000;
    box-sizing: border-box;
    -webkit-appearance: none; appearance: none;
    padding: 0;
  }
  .color-chip:hover  { outline: 1px solid var(--text-bright); outline-offset: -1px; }
  .color-chip.active { outline: 2px solid var(--text-bright); outline-offset: -2px; }
  input.color-chip { background: transparent; }
  input.color-chip::-webkit-color-swatch-wrapper { padding: 0; }
  input.color-chip::-webkit-color-swatch        { border: none; }
  input.color-chip::-moz-color-swatch           { border: none; }

  /* Loading bar — hidden by default; .active shows it, --pct in determinate mode. */
  .progress {
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 3px;
    background: rgba(255, 255, 255, 0.06);
    overflow: hidden;
    pointer-events: none;
    opacity: 0;
    transition: opacity 200ms ease-out;
    z-index: 10;
  }
  .progress.active { opacity: 1; }
  .progress > div {
    height: 100%;
    background: var(--progress);
    transform: translateX(-100%);
    animation: progress-slide 1.6s ease-in-out infinite;
  }
  .progress.determinate > div {
    animation: none;
    transform: translateX(calc(-100% + var(--pct, 0%)));
    transition: transform 120ms linear;
  }
  @keyframes progress-slide {
    0%   { transform: translateX(-100%); }
    50%  { transform: translateX(30%); }
    100% { transform: translateX(140%); }
  }

  /* Menu button + drawer scrim exist only in the narrow layout. */
  #menu-btn {
    display: none;
    background: transparent; color: var(--text);
    border: 1px solid var(--btn-border); border-radius: 3px;
    font: inherit; font-size: 18px; line-height: 1;
    padding: 6px 10px; cursor: pointer;
  }
  #scrim { display: none; }

  /* Control strip. On desktop it just sits in the top bar; the narrow
     layout drops it to its own scrollable row (see the media query). */
  #controls {
    display: flex; align-items: center; gap: 12px;
    min-width: 0;
  }
  #controls > * { min-width: 0; }

  /* Touch camera buttons — coarse-pointer only. A pinch zooms and two
     fingers pan, but one-handed on a phone neither is available. */
  #touch-controls {
    display: none;
    position: absolute;
    right: 12px; bottom: 12px;
    flex-direction: column; gap: 8px;
    z-index: 15;
  }
  #touch-controls button {
    width: 44px; height: 44px;          /* 44 px: the minimum comfortable tap target */
    border-radius: 50%;
    background: rgba(22, 22, 22, 0.72);
    color: var(--text);
    border: 1px solid var(--btn-border);
    font: 20px/1 "Trebuchet MS", "Segoe UI", Tahoma, Arial, sans-serif;
    cursor: pointer;
    /* The canvas takes touch-action:none for gestures; these are taps. */
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  #touch-controls button:active {
    background: rgba(255, 206, 64, 0.22);
    color: var(--text-bright);
  }
  @media (pointer: coarse) {
    #touch-controls { display: flex; }
  }

  /* ---- Narrow / phone layout -------------------------------------------
     Two changes carry it: the control strip wraps onto its own scrollable
     row, and the sidebar becomes an off-canvas drawer so the canvas keeps
     the whole viewport. Nothing is reparented — only laid out differently. */
  @media (max-width: 860px) {
    #menu-btn { display: block; }
    #topbar {
      flex-wrap: wrap;
      padding: 8px 10px;
      gap: 8px 10px;
    }
    #topbar .title { font-size: 17px; }
    #topbar .spacer { display: none; }
    #controls {
      order: 3;
      flex: 1 1 100%;
      max-width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    #controls::-webkit-scrollbar { display: none; }
    /* Nothing in the strip may shrink, or it all compresses instead of
       scrolling. */
    #controls > * { flex: 0 0 auto; }
    #vol-slider { width: 90px; }
    #tod-slider { width: 80px; }

    .ratory.model-viewer { grid-template-columns: 1fr; }
    .ratory.model-viewer .sidebar {
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: min(84vw, 320px);
      z-index: 25;
      transform: translateX(100%);
      transition: transform 180ms ease-out;
      box-shadow: -8px 0 24px rgba(0, 0, 0, 0.5);
      overscroll-behavior: contain;
    }
    body.sidebar-open .ratory.model-viewer .sidebar { transform: none; }
    body.sidebar-open #scrim {
      display: block;
      position: absolute; inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 20;
    }
    /* Keep the buttons clear of the drawer edge when it's open. */
    body.sidebar-open #touch-controls { display: none; }
    /* Bigger tap targets in the drawer than the desktop 3 px rows. */
    .block-body.models > a,
    .block-body.animations > a,
    .block-body.cameras > a { padding: 8px 14px; }
    #open-model, #open-dir, #load-json { padding: 9px 10px; }
  }

</style>
</head>
<body>
  <div id="topbar">
    <button id="menu-btn" type="button" title="Show model list" aria-label="Toggle sidebar">&#9776;</button>
    <span class="title">View in 3D</span>
    <span class="spacer"></span>
    <div id="controls">
    <div class="ctrl" id="fps-wrap" title="Frames per second (smoothed)">
      <label>FPS</label>
      <span id="fps-readout">—</span>
    </div>
    <div class="ctrl" title="Light-rig preset">
      <label for="lighting-select">Lighting</label>
      <select id="lighting-select">
        <option value="0">In-game</option>
        <option value="1">Glue</option>
      </select>
    </div>
    <div class="ctrl" title="Debug view (the list follows the model's materials)">
      <label for="debug-vis-select">Debug</label>
      <select id="debug-vis-select"></select>
    </div>
    <div class="ctrl" title="Force Reforged (HD) graphics on every model, regardless of its SD/HD detection">
      <input id="reforged-toggle" type="checkbox">
      <label for="reforged-toggle">Reforged</label>
    </div>
    <div class="ctrl" title="Show reference grid">
      <input id="grid-toggle" type="checkbox" checked>
      <label for="grid-toggle">Grid</label>
    </div>
    <div class="ctrl" title="Animate day-night cycle (60 s for a full day) / drag to set time of day">
      <input id="daynight-toggle" type="checkbox">
      <label for="daynight-toggle">Day/Night</label>
      <input id="tod-slider" type="range" min="0" max="24" step="0.1" value="11.5">
    </div>
    <div id="vol-wrap" title="Sound volume">
      <label for="vol-slider">Volume</label>
      <input id="vol-slider" type="range" min="0" max="100" step="1" value="50">
    </div>
    </div><!-- /#controls -->
    <span id="close-btn" class="close" title="Close">×</span>
  </div>

  <!-- DOM mirrors Hive's ratory_wc3model_preview; extra Open-directory button. -->
  <div class="ratory model-viewer" id="viewer-root">
    <canvas id="wf-canvas"></canvas>
    <div class="progress" id="progress"><div></div></div>
    <!-- Touch camera controls. One finger orbits and two pan/pinch, but a
         phone has no wheel and no second free hand while it's being held,
         so zoom and recentre also get buttons. -->
    <div id="touch-controls">
      <button id="zoom-in"  type="button" title="Zoom in"  aria-label="Zoom in">+</button>
      <button id="zoom-out" type="button" title="Zoom out" aria-label="Zoom out">&#8722;</button>
      <button id="cam-recenter" type="button" title="Recenter camera" aria-label="Recenter camera">&#8634;</button>
    </div>
    <div id="scrim"></div>
    <div class="sidebar">

      <div class="block models-container">
        <div class="block-container">
          <div class="block-header">Models</div>
          <div class="block-body models" id="model-list">
            <button id="open-model" type="button"
                    title="Open model files directly (.mdx / .mdl / .m3 / .pkb) — pick their textures in the same dialog to resolve those locally too">Open model…</button>
            <input id="model-input" type="file" multiple
                   accept=".mdx,.mdl,.m3,.pkb,.pkfx,.blp,.dds,.tga,.png,.tif"
                   style="display:none">
            <button id="open-dir" type="button">Open directory…</button>
            <input id="dir-input" type="file" webkitdirectory multiple style="display:none">
            <button id="load-json" type="button">Load JSON…</button>
            <input id="json-input" type="file" accept=".json,application/json" style="display:none">
            <span class="empty">(open a model, directory or JSON to populate)</span>
          </div>
        </div>
      </div>

      <div class="block">
        <div class="block-container">
          <div class="block-header">Team colors</div>
          <div class="block-body color-chips team-colors" id="team-swatches">
            <a class="color-chip" data-player-number="0"  title="Red"        style="background-color:#ff0402"></a>
            <a class="color-chip" data-player-number="1"  title="Blue"       style="background-color:#0042ff"></a>
            <a class="color-chip" data-player-number="2"  title="Teal"       style="background-color:#1be6ba"></a>
            <a class="color-chip" data-player-number="3"  title="Purple"     style="background-color:#540081"></a>
            <a class="color-chip" data-player-number="4"  title="Yellow"     style="background-color:#fffc00"></a>
            <a class="color-chip" data-player-number="5"  title="Orange"     style="background-color:#ff8a0d"></a>
            <a class="color-chip" data-player-number="6"  title="Green"      style="background-color:#20c000"></a>
            <a class="color-chip" data-player-number="7"  title="Pink"       style="background-color:#e45bb0"></a>
            <a class="color-chip" data-player-number="8"  title="Gray"       style="background-color:#949697"></a>
            <a class="color-chip" data-player-number="9"  title="Light blue" style="background-color:#7ebff1"></a>
            <a class="color-chip" data-player-number="10" title="Dark green" style="background-color:#106247"></a>
            <a class="color-chip" data-player-number="11" title="Brown"      style="background-color:#4f2a05"></a>
            <a class="color-chip" data-player-number="12" title="Maroon"     style="background-color:#9c0000"></a>
            <a class="color-chip" data-player-number="13" title="Navy"       style="background-color:#0000c3"></a>
            <a class="color-chip" data-player-number="14" title="Turquoise"  style="background-color:#00ebff"></a>
            <a class="color-chip" data-player-number="15" title="Violet"     style="background-color:#bd00ff"></a>
            <a class="color-chip" data-player-number="16" title="Wheat"      style="background-color:#eccd86"></a>
            <a class="color-chip" data-player-number="17" title="Peach"      style="background-color:#f7a48b"></a>
            <a class="color-chip" data-player-number="18" title="Mint"       style="background-color:#c0ff80"></a>

            <a class="color-chip" data-player-number="21" title="Snow"       style="background-color:#ecf0ff"></a>
            <a class="color-chip" data-player-number="22" title="Emerald"    style="background-color:#00781e"></a>
            <a class="color-chip" data-player-number="23" title="Peanut"     style="background-color:#a46f33"></a>
          </div>
        </div>

      <div class="block">
        <div class="block-container">
          <div class="block-header">Background</div>
          <div class="block-body color-chips background-colors" id="bg-swatches">
            <a class="color-chip" data-bg="#3e3e3e" title="Dark gray"      style="background-color:#3e3e3e"></a>
            <a class="color-chip" data-bg="#000000" title="Black"          style="background-color:#000000"></a>
            <a class="color-chip" data-bg="#ffffff" title="White"          style="background-color:#ffffff"></a>
            <a class="color-chip" data-bg="#87CEEB" title="Sky"            style="background-color:#87CEEB"></a>
            <a class="color-chip" data-bg="#00b140" title="Chroma green"   style="background-color:#00b140"></a>
            <a class="color-chip" data-bg="#b500b5" title="Chroma magenta" style="background-color:#b500b5"></a>
            <input id="bg-picker" type="color" class="color-chip color-chip--picker"
                   value="#3e3e3e" title="Custom color">
          </div>
        </div>
      </div>

      <div class="block">
        <div class="block-container">
          <div class="block-header">Animations</div>
          <div class="block-body animations" id="anim-list">
            <span class="empty">(no model loaded)</span>
          </div>
        </div>
      </div>

      <div class="block">
        <div class="block-container">
          <div class="block-header">Cameras</div>
          <div class="block-body cameras" id="camera-list">
            <a id="cam-reset" data-camera="reset">Reset</a>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // Web Crypto's 64 KiB getRandomValues cap vs Emscripten's 294 KiB seed.
    (function () {
      const MAX = 65536;
      const native = crypto.getRandomValues.bind(crypto);
      crypto.getRandomValues = function (buf) {
        if (!buf || buf.byteLength <= MAX) return native(buf);
        const u8 = new Uint8Array(buf.buffer, buf.byteOffset, buf.byteLength);
        for (let off = 0; off < u8.length; off += MAX) {
          native(u8.subarray(off, Math.min(off + MAX, u8.length)));
        }
        return buf;
      };
    })();
  </script>
  <script type="module">
    try {
      // Pull HiveApp from the staged npm package — same surface a
      // downstream consumer would see after `npm install whiteout-js-viewer`.
      const { HiveApp } = await import('./whiteout-js-viewer/index.js?t=' + Date.now());
      const app = new HiveApp({
        canvas:       document.getElementById('wf-canvas'),
        modelList:    document.getElementById('model-list'),
        animList:     document.getElementById('anim-list'),
        cameraList:   document.getElementById('camera-list'),
        teamSwatches: document.getElementById('team-swatches'),
        bgSwatches:   document.getElementById('bg-swatches'),
        bgPicker:     document.getElementById('bg-picker'),
        openModelBtn: document.getElementById('open-model'),
        modelInput:   document.getElementById('model-input'),
        openDirBtn:   document.getElementById('open-dir'),
        dirInput:     document.getElementById('dir-input'),
        loadJsonBtn:  document.getElementById('load-json'),
        jsonInput:    document.getElementById('json-input'),
        camReset:     document.getElementById('cam-reset'),
        zoomInBtn:    document.getElementById('zoom-in'),
        zoomOutBtn:   document.getElementById('zoom-out'),
        closeBtn:     document.getElementById('close-btn'),
        progress:     document.getElementById('progress'),
        volSlider:    document.getElementById('vol-slider'),
        lightingSel:  document.getElementById('lighting-select'),
        debugVisSel:  document.getElementById('debug-vis-select'),
        gridToggle:   document.getElementById('grid-toggle'),
        reforgedToggle: document.getElementById('reforged-toggle'),
        dayNightToggle: document.getElementById('daynight-toggle'),
        todSlider:    document.getElementById('tod-slider'),
        fpsReadout:   document.getElementById('fps-readout'),
      }, {
        // Demo's sw.js lives next to index.html, not inside the package.
        serviceWorkerUrl: './sw.js',
        // Hive serves /repository-files/ (uploaded models + textures)
        // WITHOUT CORS headers, so the browser can't read them
        // cross-origin — route just those through the dev server's
        // same-origin /hive-proxy/ (serve_nocache.py forwards to www).
        // /casc-contents/ and /assets/ DO send CORS, so they go direct.
        urlRewriter: (url) => {
          if (typeof url !== 'string') return url;
          const PROD = 'https://www.hiveworkshop.com/';
          if (url.startsWith(PROD + 'repository-files/')) return '/hive-proxy/' + url.slice(PROD.length);
          return url;
        },
      });
      await app.start();
      window.__hive = app;

      // Off-canvas sidebar (narrow layout only — the CSS ignores the class
      // above 860 px, so this is inert on desktop).
      const menuBtn = document.getElementById('menu-btn');
      const scrim   = document.getElementById('scrim');
      const closeDrawer = () => document.body.classList.remove('sidebar-open');
      if (menuBtn) {
        menuBtn.addEventListener('click',
          () => document.body.classList.toggle('sidebar-open'));
      }
      if (scrim) scrim.addEventListener('click', closeDrawer);
      // Picking a model is the reason the drawer was opened, so close it
      // and let the user watch what they picked.
      document.getElementById('model-list')
        ?.addEventListener('click', (e) => { if (e.target.closest('a')) closeDrawer(); });
      // The direct-open button is not a row, and its click only opens a file
      // dialog — the model arrives on the picker's `change`.
      document.getElementById('model-input')
        ?.addEventListener('change', closeDrawer);

      document.getElementById('cam-recenter')
        ?.addEventListener('click', () => app.viewer.resetCamera());
    } catch (e) {
      console.error('[wf] FATAL', e);
    }
  </script>
</body>
</html>
